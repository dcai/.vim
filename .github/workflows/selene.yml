name: Selene Lint

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/*.lua"
      - "selene.toml"
      - "neovim.yaml"
      - ".github/workflows/selene.yml"
  pull_request:
    paths:
      - "**/*.lua"
      - "selene.toml"
      - "neovim.yaml"
      - ".github/workflows/selene.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Selene
        run: |
          curl -Ls https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip -o selene.zip
          unzip selene.zip
          chmod +x selene
          ./selene init.lua lua after/plugin plugin colors --display-style quiet
