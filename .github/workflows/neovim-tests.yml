name: Neovim Tests

on:
  push:
    paths:
      - "**/*.lua"
      - ".github/workflows/neovim-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Copilot tests (latest upstream)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      XDG_DATA_HOME: ${{ runner.temp }}/nvim-test-data
      NVIM_APPNAME: nvim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest stable Neovim
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz \
            --output "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version

      - name: Install latest copilot-lsp
        shell: bash
        run: |
          plugin="$XDG_DATA_HOME/nvim/plug/copilot-lsp"
          git clone --depth 1 \
            https://github.com/copilotlsp-nvim/copilot-lsp.git \
            "$plugin"
          git -C "$plugin" log -1 --format='%H %s'

      - name: Test Copilot configuration
        run: nvim --headless --clean -l tests/copilot-test.lua

      - name: Test native inline-completion regression
        run: nvim --headless --clean -l tests/copilot-inline-test.lua
