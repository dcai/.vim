name: Neovim Tests

on:
  push:
    paths:
      - "**/*.lua"
      - ".github/workflows/neovim-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Neovim configuration (latest upstream)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NVIM_APPNAME: nvim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install latest stable Neovim
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz \
            --output "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/nvim-test-data" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version

      - name: Install latest test dependencies
        shell: bash
        run: |
          XDG_CONFIG_HOME="$RUNNER_TEMP/nvim-test-config" \
            nvim --headless --clean -l tests/install-dependencies.lua

      - name: Test native package configuration
        run: nvim --headless --clean -l tests/pack-test.lua

      - name: Test shared helpers
        run: nvim --headless --clean -l tests/globals-test.lua

      - name: Test native job wrapper with mini.test
        run: nvim --headless --noplugin -u tests/minimal-init.lua -i NONE -c 'lua MiniTest.run()'

      - name: Test Blink native matcher
        run: nvim --headless --clean -l tests/blink-test.lua

      - name: Test Copilot configuration
        run: nvim --headless --clean -l tests/copilot-test.lua

      - name: Test native inline-completion regression
        run: nvim --headless --clean -l tests/copilot-inline-test.lua
